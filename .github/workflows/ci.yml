# main 宛の PR と main への push で、開発用 Postgres の起動（compose.yaml）と psql での接続確認、マイグレーション、
# lint / test / build / E2E テストを実行する。pnpm test（Postgres を使う単体テストを含む）と E2E は起動した Postgres を使う。
# main の Ruleset（protect-main）でこのワークフローの `ci` ジョブを required status check にしており、
# 通らないと PR をマージできない（.claude/skills/pr-flow/github-settings.md）。
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 同じブランチで push が続いたら、古い実行を止めて最新だけを動かす（順番待ちで結果が遅れるのを防ぐ）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 読み取りだけにする。lint / test / build はリポジトリに書き込まない（最小権限）。
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # timeout-minutes: job 全体の上限（分）。超えると GitHub が job を止めて失敗にする。書かないと既定の 360 分まで止まらない。
    # WHY 30 分: 直近 100 回の実行（2026-10-02、`gh run list --workflow ci.yml --limit 100`）の成功 93 回の所要時間は
    #   最短 101 秒・中央値 145 秒・最長 207 秒（約 3.5 分）。テストや E2E が増えても余裕のある上限にし、テストの無限ループや
    #   Postgres・サーバの待ちの固まりで Actions の分数を食い続けないようにする（Issue #351。.claude/rules/tooling/github-actions.md）。
    #   rule-tests/github-actions.test.ts の job-timeout がすべての job にあることを検査する。
    timeout-minutes: 30
    env:
      # next build が Vercel に匿名テレメトリを送るのを止める（CI から外部に送る必要がない）。
      NEXT_TELEMETRY_DISABLED: "1"
    # GitHub Actions は CI=true を既定で設定するので、pnpm install の lefthook postinstall はフックを入れない（.claude/rules/quality/lint.md）。
    steps:
      # fetch-depth: 0: 全ブランチと全履歴を取る（既定の 1 は PR のマージコミット 1 つだけ）。
      # WHY: 下の作業ログの検査（check-work-logs-diff.sh）が `origin/<base>...HEAD` の三点 diff で PR の変更だけを見るため、
      #   base ブランチ（origin/main）と、HEAD との分岐点（merge-base）までの履歴が要る。浅い履歴では分岐点が求まらず失敗する。
      #   rule-tests/work-logs-check.test.ts がこの値を検査する。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # PR の差分に作業ログ（docs/work-logs/*.md）の変更が無ければ失敗させる（Issue #64。置き場所は Issue #101。.claude/rules/tooling/work-log-hooks.md）。
      # WHY: 調査だけの依頼などで作業ログの追記が漏れた。文書だけの PR も例外にしない（ユーザー判断）。例外は、作者が renovate[bot] で
      #   依存のファイルだけを変えた PR だけ（スクリプトがイベントの JSON から判定する。Issue #111）。
      # WHY pull_request のときだけ: main への push では github.base_ref が空で、比べる base が無い。
      # WHY 最初に置く: install も Postgres も要らない検査（runner にある node だけを使う。Issue #178）なので、準備より先に、原因の分かる
      #   メッセージで止める。rule-tests/work-logs-check.test.ts が「pnpm lint より前」「if・continue-on-error・失敗を打ち消す書き方が無い」を検査する。
      - name: Check docs/work-logs in PR diff
        if: github.event_name == 'pull_request'
        run: bash scripts/hooks/check-work-logs-diff.sh origin/${{ github.base_ref }}

      # Node の版は .tool-versions が正（.claude/rules/tooling/env.md）。ワークフローに直書きせず、nodejs 行から読む。
      - name: Read Node.js version from .tool-versions
        run: echo "NODE_VERSION=$(awk '$1 == "nodejs" { print $2 }' .tool-versions)" >> "$GITHUB_ENV"

      # pnpm の版は package.json の packageManager から取る（version を省略すると pnpm/action-setup が packageManager を読む）。
      # setup-node の cache: pnpm より先に pnpm を入れておく必要がある。
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # --frozen-lockfile: lockfile と package.json がずれていたら更新せず失敗させる（.claude/rules/tooling/dependencies.md）。
      - run: pnpm install --frozen-lockfile

      # 依存（lockfile のすべてのパッケージ。devDependencies を含む）の既知の脆弱性を、npm レジストリの advisory で検査する（Issue #112）。
      # --audit-level high: high と critical があれば失敗する（moderate / low は表示もしない）。WHY high: 2026-10-03 の実測で moderate が
      #   4 件（Stryker の推移的依存の qs など、開発時だけ使うもの）あり、moderate で止めると修正できるまで全 PR が止まる。
      #   決定と minimumReleaseAge（5 日）との関係・誤検知の抑え方（pnpm-workspace.yaml の auditConfig.ignoreGhsas）は
      #   ADR docs/adr/quality/20261003-pnpm-audit-in-ci.md。
      # WHY ci ジョブの中: Ruleset protect-main の required status check は ci だけなので、ここに置けば high が残る PR はマージできない。
      # WHY --ignore-registry-errors を付けない: レジストリが落ちたときに検査を飛ばして緑にしない（検査できないなら赤にする）。
      # rule-tests/github-actions.test.ts の auditsDependencies がこの形（ci ジョブ・コマンドの完全一致・if と continue-on-error なし）を検査する。
      - run: pnpm audit --audit-level high

      # 開発用の PostgreSQL を compose.yaml で起動する（Issue #51）。
      # WHY GitHub Actions の services: を使わないか: 手元・クラウドセッションと同じ compose.yaml を使い、
      #   イメージ・ユーザー・ポート・healthcheck の定義を 1 か所にする（services: に書くと CI だけ別の定義になる）。
      #   ubuntu-latest のランナーには Docker と Compose プラグインが入っている。
      # イメージは compose.yaml で mirror.gcr.io（Docker Hub のミラー）から取るので、Docker Hub の匿名 pull の
      #   レート制限（出口 IP ごとに 100 回/時）を Actions のランナーでも避けられる。
      # -d: バックグラウンドで起動する。--wait: compose.yaml の healthcheck（pg_isready）が healthy になるまで待つ。
      #   unhealthy になったら失敗で返り、このステップが赤になる。
      # --wait-timeout 120: 待つ上限（秒）。クラウドのフック（scripts/cloud-session-start.sh）と同じ値。healthcheck は
      #   約 30 秒で unhealthy になるが、コンテナの起動そのものが止まったときにもジョブを長く止めないようにする。
      # 後片付け（docker compose down）はしない: ジョブが終わるとランナーごと破棄される。
      - name: Start Postgres
        run: docker compose up -d --wait --wait-timeout 120

      # 起動した Postgres に psql で接続できることを確かめる（compose.yaml の POSTGRES_USER / POSTGRES_DB と同じ app / app）。
      # -T: TTY を割り当てない。GitHub Actions のステップには TTY が無い。Compose v5.1.1 では -T なしでも
      #   TTY の無い環境で動いた（2026-09-28 実測）が、既定は TTY を割り当てる動作なので、自動判定に頼らず明示する。
      # psql はコンテナ内のものを使う（ランナーに psql が入っているかに依存しない）。
      - name: Check Postgres connection
        run: docker compose exec -T db psql -U app -d app -c 'select 1'

      # .env を .env.example から作る（Issue #59）。
      # WHY: アプリ・テスト・drizzle-kit・Playwright は必須の環境変数（DATABASE_URL など）を .env から読み
      #   （apps/shared/env.ts）、コードに既定値を持たない。.env はコミットしない（.gitignore）ので、手元と同じく
      #   `cp .env.example .env` で作る。値は compose.yaml の開発用 DB に合わせた開発用の値で、秘密ではない。
      # WHY ワークフローの env: に書かない: 値を .env.example の 1 か所にし、手元・クラウド・CI で同じ値を使うため。
      #   ここで作った .env は、以降のステップ（migrate / lint / test / build / E2E）がすべて読む。
      - name: Create .env from .env.example
        run: cp .env.example .env

      # apps/backend/shared/drizzle/migrations/ のマイグレーションを Postgres に当てる（Issue #57）。pnpm db:migrate は入口
      #   apps/backend/shared/drizzle/migrate.ts を esbuild で束ねて node で実行する。Cloud Run の migrate ジョブが runtime イメージで
      #   実行するのと同じファイルなので、ジョブで動くものを PR ごとに確かめることにもなる（Issue #326）。
      # WHY ここで当てるか: E2E（pnpm test:e2e）の next start は Postgres の todos 表を使うが、webServer の中では
      #   マイグレーションを当てない方針（apps/e2e/playwright.config.ts）。E2E より前に 1 回だけ当てておく。
      #   単体テスト（pnpm test）は、テストごとに別のスキーマを作ってそこに当てる（apps/backend/test-support/database.ts）ので、
      #   この結果には依存しない。
      # 接続先は上で作った .env の DATABASE_URL（migrate.ts のアプリのプールが env.ts 経由で読む）。
      - name: Apply database migrations
        run: pnpm db:migrate
      - run: pnpm lint
      # 型チェック（tsc -p . --noEmit && tsc -p apps/backend --noEmit && tsc -p apps/shared --noEmit。package.json の typecheck）。
      # WHY: next build（apps/frontend_customer で実行）は apps/frontend_customer と、そこから import された backend のファイルしか型チェックしない
      #   （Issue #68 で monorepo にする前は、next build がリポジトリ直下の tsconfig で全体を型チェックしていた）。
      #   テスト・ルール検査テスト・e2e・設定ファイルの型エラーと、backend・apps/shared が DOM の型に依存すること（apps/backend・
      #   apps/shared の tsconfig は DOM の型を持たない）は、ここで止める。Vitest は型を検査しないので pnpm test でも止まらない。
      #   build より前に置き、型エラーを build より先に分かるメッセージで止める（rule-tests/typecheck.test.ts が順序と書き方を検査する）。
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # E2E テスト（Playwright）に使う Chromium を入れる。
      # pnpm --filter @repo/e2e exec: Playwright は E2E の workspace パッケージ @repo/e2e（apps/e2e/package.json）の依存で、
      #   リポジトリ直下には無い（Issue #84）。apps/e2e をカレントディレクトリにして、その node_modules/.bin/playwright
      #   （@playwright/test と同じ版）を動かす。
      # chromium: apps/e2e/playwright.config.ts のプロジェクトは Chromium だけなので、他のブラウザは入れない
      #   （版は @playwright/test が要求するビルド。本体と headless shell の両方が入る。--dry-run で確認）。
      # --with-deps: Chromium が必要とする OS の依存ライブラリ（apt パッケージ）も一緒に入れる。
      #   ランナーのイメージにどのライブラリが入っているかに依存せず、ブラウザが起動できるようにする。
      # PLAYWRIGHT_CHROMIUM_EXECUTABLE は設定しない（クラウド VM 用。apps/e2e/playwright.config.ts のコメント）。
      - run: pnpm --filter @repo/e2e exec playwright install --with-deps chromium

      # E2E テストを実行する（pnpm --filter @repo/e2e test = apps/e2e の bddgen && playwright test。bddgen が .feature から
      #   Playwright のテストを生成する。Issue #279）。
      # webServer（apps/e2e/playwright.config.ts）が pnpm -w build && pnpm -w start -p 3100 でサーバを起動する。
      #   apps/e2e/playwright.config.ts が .env の DATABASE_URL（env.ts）を webServer に渡し、Postgres で動かす。
      #   上の pnpm build の成果物を使い回さず build し直すが、ローカルと同じコマンドで動かすことを優先する（単純さのため）。
      # CI=true（GitHub Actions の既定）なので reuseExistingServer は無効になり、必ずこのコードでサーバを新しく起動する。
      - run: pnpm test:e2e
