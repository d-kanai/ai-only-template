# main 宛の PR と main への push で lint / test / build / E2E テストを実行する。
# main の Ruleset（protect-main）でこのワークフローの `ci` ジョブを required status check にしており、
# 通らないと PR をマージできない（rules/general/branch.md の「CI」）。
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 同じブランチで push が続いたら、古い実行を止めて最新だけを動かす（順番待ちで結果が遅れるのを防ぐ）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 読み取りだけにする。lint / test / build はリポジトリに書き込まない（最小権限）。
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # next build が Vercel に匿名テレメトリを送るのを止める（CI から外部に送る必要がない）。
      NEXT_TELEMETRY_DISABLED: "1"
    # GitHub Actions は CI=true を既定で設定するので、pnpm install の lefthook postinstall はフックを入れない（rules/code/lint.md）。
    steps:
      - uses: actions/checkout@v4

      # Node の版は .tool-versions が正（rules/code/env.md）。ワークフローに直書きせず、nodejs 行から読む。
      - name: Read Node.js version from .tool-versions
        run: echo "NODE_VERSION=$(awk '$1 == "nodejs" { print $2 }' .tool-versions)" >> "$GITHUB_ENV"

      # pnpm の版は package.json の packageManager から取る（version を省略すると pnpm/action-setup が packageManager を読む）。
      # setup-node の cache: pnpm より先に pnpm を入れておく必要がある。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # --frozen-lockfile: lockfile と package.json がずれていたら更新せず失敗させる（rules/code/dependencies.md）。
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      # E2E テスト（Playwright）に使う Chromium を入れる。
      # chromium: playwright.config.ts のプロジェクトは Chromium だけなので、他のブラウザは入れない
      #   （版は @playwright/test が要求するビルド。本体と headless shell の両方が入る。--dry-run で確認）。
      # --with-deps: Chromium が必要とする OS の依存ライブラリ（apt パッケージ）も一緒に入れる。
      #   ランナーのイメージにどのライブラリが入っているかに依存せず、ブラウザが起動できるようにする。
      # PLAYWRIGHT_CHROMIUM_EXECUTABLE は設定しない（クラウド VM 用。playwright.config.ts のコメント）。
      - run: pnpm exec playwright install --with-deps chromium

      # E2E テストを実行する（playwright test）。
      # webServer（playwright.config.ts）が pnpm build && pnpm start -p 3100 でサーバを起動する。
      #   上の pnpm build の成果物を使い回さず build し直すが、ローカルと同じコマンドで動かすことを優先する（単純さのため）。
      # CI=true（GitHub Actions の既定）なので reuseExistingServer は無効になり、必ずこのコードでサーバを新しく起動する。
      - run: pnpm test:e2e
