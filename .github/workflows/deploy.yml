# main への push（PR のマージ）と手動実行で、frontend-customer を Cloud Run の本番にデプロイする（Issue #137）。
# 流れ: WIF で GCP に認証 → runtime / migrate の 2 イメージを build して Artifact Registry に push → migrate ジョブのイメージを
#   入れ替えて実行（成功を待つ）→ 本番の service のイメージを入れ替える → preview の DB にも main のマイグレーションを当てる。
# 器（service / job / DB / 権限）は Terraform（infra/）が作る。このワークフローはイメージだけを入れ替える（WHY は infra/main.tf）。
# 名前（service / job）は infra/main.tf の locals と同じ。GitHub の Variables（vars.*）は `terraform output github_variables` の値。
# 手順・ロールバックは .claude/skills/deploy/SKILL.md。
name: Deploy

on:
  push:
    branches: [main]
  # 手動の再デプロイ（Actions の画面の「Run workflow」。main 以外のブランチも選べるが、本番に出るので main で使う）。
  workflow_dispatch:

# 本番へのデプロイを 1 本ずつ順に実行する。
# WHY cancel-in-progress: false: 途中で止めると、マイグレーションを当てたのにアプリが古いまま、のような中途半端な状態が残る。
#   後から来た実行は、前の実行が終わるまで待つ（GitHub は待っている実行を最新の 1 つだけ残す）。
concurrency:
  group: deploy-prod
  cancel-in-progress: false

# contents: read: checkout だけ。id-token: write: GitHub の OIDC トークンを発行し、WIF で GCP のトークンに交換する（鍵ファイルを使わない）。
permissions:
  contents: read
  id-token: write

env:
  REGION: ${{ vars.GCP_REGION }}
  # イメージのタグは git の sha。WHY: どのコミットのイメージがどのリビジョンで動いているかを 1 対 1 で辿れる（latest は使わない）。
  IMAGE: ${{ vars.GCP_AR_REPO }}/frontend-customer:${{ github.sha }}
  MIGRATE_IMAGE: ${{ vars.GCP_AR_REPO }}/frontend-customer-migrate:${{ github.sha }}
  SERVICE: frontend-customer
  MIGRATE_JOB: frontend-customer-migrate
  MIGRATE_PREVIEW_JOB: frontend-customer-migrate-preview

jobs:
  deploy:
    # WHY Variables が無ければ実行しない: GCP の準備（infra/README.md の初回手順）をする前のリポジトリ（テンプレートから作った直後など）で、
    #   main への push のたびに赤くならないようにする。スキップはジョブの「skipped」として見える。
    if: vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # WIF で deployer のサービスアカウントになりすます（infra/github_wif.tf）。以降の gcloud / docker はこの資格情報を使う。
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      # gcloud を入れる（version を省くと action の既定の "latest"。WHY 固定しない: 使うのは run / auth の基本のコマンドだけで、
      #   引数が版で変わりにくい）。
      - uses: google-github-actions/setup-gcloud@v3

      # docker が Artifact Registry に push するときに gcloud の資格情報を使うようにする（~/.docker/config.json の credHelpers）。
      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      # BuildKit のビルダーを作る。WHY: Dockerfile の RUN --mount=type=cache と、下の GitHub Actions のキャッシュ（type=gha）は
      #   docker-container ドライバの BuildKit が要る。
      - uses: docker/setup-buildx-action@v4

      # アプリのイメージ（Dockerfile の runtime ステージ。next の standalone を node で起動）。
      # cache: ステージのレイヤーを GitHub Actions のキャッシュに置き、次の実行で依存の install などを飛ばす。
      #   scope をイメージごとに分ける（同じ scope に 2 つを書くと、後の書き込みで先のキャッシュの参照が上書きされる）。
      #   mode=max: 最終ステージ以外（deps / build）のレイヤーもキャッシュする。
      - name: Build and push runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max

      # マイグレーションのイメージ（Dockerfile の migrate ステージ。`pnpm db:migrate` を実行する）。
      - name: Build and push migrate image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrate
          push: true
          tags: ${{ env.MIGRATE_IMAGE }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max

      # migrate ジョブのイメージを今回のものにする。WHY service より先: 新しいコードが使う表・列を、新しいリビジョンが
      #   リクエストを受ける前に作っておく（マイグレーションは古いコードとも動く形で書く前提）。
      - name: Update migrate job image
        run: gcloud run jobs update "$MIGRATE_JOB" --image "$MIGRATE_IMAGE" --region "$REGION" --quiet

      # マイグレーションを実行し、終わるまで待つ（--wait）。失敗したらこのステップが赤になり、以降（service のデプロイ）は
      #   実行されない。WHY: スキーマが古いまま新しいコードを出さない。
      - name: Run migrations
        run: gcloud run jobs execute "$MIGRATE_JOB" --region "$REGION" --wait

      # 本番の service のイメージを入れ替える（新しいリビジョンを作り、準備ができたらトラフィックを 100% 移す）。
      # 環境変数・Secret・スケールなどの設定は Terraform のまま（--image だけを変える）。
      - name: Deploy service
        run: gcloud run deploy "$SERVICE" --image "$IMAGE" --region "$REGION" --quiet

      # preview の DB（app_preview）にも main のマイグレーションを当てる（WHY は infra/run.tf の migrate_preview）。
      # WHY 本番のデプロイの後: preview の失敗で本番のデプロイを止めない。失敗したらこのステップが赤になり、気づける。
      - name: Update and run preview migrations
        run: |
          gcloud run jobs update "$MIGRATE_PREVIEW_JOB" --image "$MIGRATE_IMAGE" --region "$REGION" --quiet
          gcloud run jobs execute "$MIGRATE_PREVIEW_JOB" --region "$REGION" --wait
