# pnpm の設定ファイル。pnpm workspace（モノレポ）の範囲（packages）と、workspace 全体に効く pnpm の設定を書く。
#
# packages: workspace に含めるパッケージのディレクトリ（Issue #68 の段階 2）。
#   apps/frontend（@repo/frontend、Next.js）と apps/backend（@repo/backend、pure な TypeScript）を workspace パッケージにし、
#   frontend は "@repo/backend": "workspace:*" で backend に依存する（node_modules/@repo/backend が apps/backend への symlink になる）。
#   リポジトリ直下（package.json）も workspace のルートとして 1 つのパッケージになり、ツール（Biome・Vitest・Playwright など）を持つ。
#   WHY パッケージに分ける: 依存（drizzle-orm / pg は backend、next / react は frontend）と公開する入口（apps/backend/package.json の
#   exports）をパッケージの単位で分け、後で backend を別プロセスに分けやすくする（ADR docs/adr/20260928-monorepo-apps-frontend-backend.md）。
#   下の設定（サプライチェーン保護・allowBuilds・patchedDependencies）は workspace 全体に効くので、ここ（ルート）にだけ書く。
#   rule-tests/package.test.ts はこの packages を読んで、すべての package.json の依存の版を検査する（"<ディレクトリ>/*" の形だけを扱う）。
packages:
  - apps/*
#
# allowBuilds: 依存パッケージのインストール時ビルドスクリプト（postinstall 等）の実行可否をパッケージごとに指定する。
#   false は「実行しない」。ビルドスクリプトは任意コードを実行できるため、許可するパッケージを明示的に絞る。
#
# 下記 2 つを false にしているのは、create-next-app@16.3.6（pnpm 12.7.0）が生成した pnpm-workspace.yaml を
# そのまま流用しているため（根拠は create-next-app の出力。値の妥当性を本リポジトリで個別に検証したわけではない）。
#   - sharp: Next.js の画像最適化で使うネイティブモジュール。2026-09-28 時点、ビルドスクリプトなしで
#     プリビルドバイナリ（@img/sharp-darwin-arm64 など）がインストールされることを node_modules で確認済み。
#   - unrs-resolver: 現状の依存（ESLint なし）ではインストールされない。create-next-app の出力に合わせて残している。
#
# esbuild: false … drizzle-kit（0.31.11）が esbuild 0.18.20 / 0.25.12 を、drizzle-kit と vite が使う tsx（4.23.15）が
#   esbuild 0.28.2 を依存に持つ（Issue #57 で drizzle-kit を追加して入った。`pnpm why esbuild` で確認）。
#   postinstall（install.js）の中身は、プラットフォーム別パッケージ（@esbuild/linux-x64 など、optionalDependencies）の
#   バイナリが見つからなければ npm / レジストリから取り直し、見つかれば bin/esbuild をネイティブバイナリへの
#   ハードリンクに差し替える（起動の高速化）だけ（node_modules/esbuild/install.js を読んで確認）。プラットフォーム別
#   パッケージは pnpm が入れるので、実行しなくても JS のラッパー経由でバイナリが使える。任意コードの実行を増やさないため false。
#   `pnpm db:generate`（drizzle-kit generate）が動くことで確認した（2026-09-28）。
#
# lefthook: true … Git フック管理ツール（.claude/rules/lint.md）。postinstall で `lefthook install -f` を実行し、
#   .git/hooks/pre-commit を Lefthook のスクリプトに置き換える（-f: 既存フックの退避ファイル .old を上書きし、
#   core.hooksPath が設定されていても続行する。`lefthook install --help` で確認）。これにより `pnpm install` するだけで
#   pre-commit の Biome 検査が有効になり、人間・AI どちらもフックの入れ忘れがなくなる。
#   postinstall の中身は node_modules/lefthook/postinstall.js（lefthook@2.1.12）を読んで確認した: 環境変数 CI が有効
#   （"0" / "false" 以外）で LEFTHOOK が有効でなければ何もせず終了し、それ以外はプラットフォーム別パッケージ
#   （lefthook-darwin-arm64 など）に同梱されたバイナリで `lefthook install -f` を実行するだけ。ネットワークアクセスはしない。
#   許可にしたのは、Lefthook 公式ドキュメント（docs/installation/node.md）が pnpm 利用時に lefthook の postinstall の実行を
#   許可するよう案内しているため。package.json の prepare スクリプトで `lefthook install` を呼ぶ方法もあるが、
#   公式の案内に合わせ、フックの導入経路を postinstall の 1 本にしている。
#   @biomejs/biome と各プラットフォーム別パッケージ（@biomejs/cli-* / lefthook-*）はビルドスクリプトを持たないため載せていない
#   （npm レジストリのメタデータで scripts が null であることを確認）。
allowBuilds:
  esbuild: false
  sharp: false
  unrs-resolver: false
  lefthook: true

# ---- サプライチェーン保護設定 ----
# 設定の意味は pnpm 公式ドキュメント（https://pnpm.io/settings 、https://pnpm.io/supply-chain-security ）に基づく。

# minimumReleaseAge: 公開から指定時間（分単位。7200 = 5 日）経っていないバージョンは、推移的依存も含めてインストールしない。
#   悪意あるリリースは公開後しばらくして検知・削除されることが多く、その期間を待ってから取り込むため。
#   5 日にした理由（Issue #32、ユーザーの判断）:
#   - 開発機の safe-chain は最小パッケージ年齢 14 日（~/.aikido/config.json）。これに揃えると Next.js などの更新に
#     2 週間遅れで追随することになるため、揃えずに 5 日にした。pnpm 11 以降の既定（1440 = 1 日）よりは長くする。
#   - safe-chain は開発機のシェル関数経由の実行にしか効かない（クラウドセッション・CI・shim 直叩きでは効かない）。
#     pnpm 側の設定は実行経路に依存せず lockfile の解決・install のたびに効くため、こちらを全環境共通の防御とする。
#   既定値のままだと非 strict（条件を満たす版がないと古い版にフォールバック）になるため、
#   下の minimumReleaseAgeStrict と合わせて明示している。値は rule-tests/pnpm-workspace.test.ts で検査している。
#   対象外: package.json の packageManager（pnpm 本体）の解決。lockfile 先頭の pnpm@12.7.0 / @pnpm/exe.* は
#   2026-09-25 公開（5 日未満）でも拒否されなかった（2026-09-28 実測。公式仕様は未確認）。pnpm 本体の版は
#   .claude/rules/env.md のとおり .tool-versions と packageManager で明示的に固定しているので、勝手に新しい版が入ることはない。
minimumReleaseAge: 7200

# minimumReleaseAgeStrict: minimumReleaseAge を満たす版がなければ、フォールバックせず install を失敗させる。
#   minimumReleaseAge を明示設定したときは既定で true だが、意図を明確にするため書いている。
minimumReleaseAgeStrict: true

# trustPolicy: no-downgrade は、過去の版より信頼度（trusted publisher / provenance の有無）が下がった版の
#   インストールを拒否する。パッケージ乗っ取りへの対策。
trustPolicy: no-downgrade

# trustPolicyIgnoreAfter: 公開から指定時間（分単位。525600 = 1 年）以上経った版は trustPolicy の検査対象外にする。
#   導入時（2026-09-28、PR #14）の lockfile で undici-types@6.21.0（2024-11-13 公開、@types/node の依存）と
#   why-is-node-running@3.2.2（2025-01-08 公開、vitest の依存）が trust downgrade と判定され、
#   ERR_PNPM_TRUST_DOWNGRADE で install が失敗した。古い版は provenance 付きで公開する仕組みが整う前のものが多く、
#   公式ドキュメントもこの用途に trustPolicyIgnoreAfter を案内している。
#   パッケージごとの個別除外（trustPolicyExclude）ではなく、期間で一律にした。
trustPolicyIgnoreAfter: 525600

# blockExoticSubdeps: 推移的依存が git リポジトリや直接 URL の tarball から取得されるのを禁止する（直接依存のみ許可）。
#   pnpm 10.26 以降は既定で true だが明示している。
blockExoticSubdeps: true

# strictDepBuilds: allowBuilds で許可・不許可をレビューしていないビルドスクリプトがあれば、警告ではなく install を失敗させる。
#   既定で true だが明示している。
strictDepBuilds: true

# ---- 依存の版の書き方 ----

# savePrefix: `pnpm add` が package.json に書く版の接頭辞（https://pnpm.io/settings/other#saveprefix ）。
#   既定は '^'（例: 1.2.3 → ^1.2.3。マイナー更新を許す範囲指定になる）。'' にすると接頭辞なしの 1.2.3（完全固定）で書かれる。
#   依存はすべて完全固定する方針のため（.claude/rules/dependencies.md）、`pnpm add <pkg>` で版を書き忘れても範囲指定にならないようにしている。
#   注意: 公式ドキュメントのとおり、`pnpm add foo@2` のように範囲を指定して追加した場合はこの設定は無視され、
#   package.json には "2" と範囲のまま書かれる。そのため版は `pnpm add <pkg>@<x.y.z>` で明示し、rule-tests/package.test.ts でも検査している。
savePrefix: ''

# patchedDependencies: 依存パッケージに当てるパッチ（pnpm patch / pnpm patch-commit で作る）。キーは「パッケージ@版」、
#   値はパッチファイルのパス。pnpm install のたびに node_modules の中身へ当てられ、lockfile にもパッチのハッシュが入る
#   （パッチを変えると --frozen-lockfile が lockfile とのずれで失敗するので、パッチと lockfile は同じコミットで直す）。
#   使ってよい条件・外す条件・確認方法は .claude/rules/dependencies.md の「pnpm patch」。
#   - @stryker-mutator/vitest-runner@10.0.0（Issue #52）: テスト名の連結をスペースから " > " に直す（dist の 2 ファイル各 1 行）。
#     Vitest 5.0.1 の testNamePattern はフルネームを " > " 区切りで照合するため、直さないと describe の中のテストが
#     変異ごとの実行で skip され、mutation score が実際より低く出る（2026-09-28 実測で 26.82% → 85.68%。詳細は
#     stryker.config.mjs のコメント）。版を上げるとキーの版と合わなくなるので、上げるときに patch の要否を見直す。
#     上流の Issue / PR の有無は未確認（この環境から GitHub の Issue 検索が 403）。2026-09-28 時点で上流の master の
#     packages/vitest-runner/src/test-helpers.ts もスペース区切りのまま（raw.githubusercontent.com で確認）。
patchedDependencies:
  '@stryker-mutator/vitest-runner@10.0.0': patches/@stryker-mutator__vitest-runner@10.0.0.patch
